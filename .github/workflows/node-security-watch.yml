name: Node Security Watch

# Daily: if nodejs.org marks a release on the pinned major as a security release
# newer than the Dockerfile's pin, open a PRIVATE draft security advisory so the
# operator is told without the public repo announcing an unpatched production.
# Logic and the reasoning: scripts/node-security-watch.js. Not part of ci-passed —
# it gates nothing and never runs on a PR, so the token never meets fork code.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Create a TEST draft advisory to verify the token and the notification'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node scripts/node-security-watch.js
        env:
          GH_ADVISORY_TOKEN: ${{ secrets.GH_ADVISORY_TOKEN }}
          WATCH_TEST: ${{ inputs.test }}
