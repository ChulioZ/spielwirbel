# Dependabot keeps dependencies current and opens PRs for known-vulnerable ones
# (paired with GitHub's Dependabot security alerts, enabled in repo Settings).
# The opened PRs run the CI + Lint workflows, so updates are validated before merge.
version: 2
updates:
  # npm dependencies (express, multer, eslint, supertest, …)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # The GitHub Actions used by the workflows (actions/checkout, setup-node, …).
  # Every `uses:` is pinned to a full commit SHA with a `# vN.x.y` trailing comment;
  # Dependabot keeps those SHA pins current and rewrites the comment, so pinning
  # costs no freshness. A mutable major tag can be retargeted at new code — the
  # 2025 tj-actions/changed-files incident — and `gitleaks` here is a REQUIRED
  # branch-protection context while docker.yml publishes to GHCR with GITHUB_TOKEN.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  # The Dockerfile's Node base image. Pinned to an exact patch (not `node:26-slim`),
  # so a Node security release arrives as a reviewable, CI-tested PR rather than
  # depending on whether the builder re-pulled a floating tag.
  #
  # Deliberately carries NO `ignore` rule for major bumps (#994). Dependabot opens
  # one PR per dependency, so a major that sits open — deliberately held, or just
  # unhandled — leaves no patch PR behind it, and the channel added to prevent a
  # silent freeze freezes itself in the state that looks healthiest. Majors are
  # therefore ordinary PRs here, reviewed and merged or closed like any other.
  # test/docker.test.js fails if an ignore rule appears without that decision
  # moving. See .claude/rules/pin-images-and-actions-by-digest.md.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
