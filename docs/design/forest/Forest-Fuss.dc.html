<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="../../../public/fonts/tabler-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Alegreya+Sans:wght@400;700;800&display=swap" rel="stylesheet">
</helmet>
<footer style="display: flex; flex-wrap: wrap; align-items: center; gap: 0 18px; width: 100%; box-sizing: border-box; padding: {{ pad }}; border-top: 1px solid #d5ddca; background: #ecf1e4; font-family: 'Alegreya Sans', sans-serif; font-weight: 700; font-size: 14px; color: #4b5c45;">
  <sc-for list="{{ links }}" as="l" hint-placeholder-count="5"><a href="#" style="min-height: 32px; display: inline-flex; align-items: center; color: #4b5c45;" style-hover="color: #1b2a18; text-decoration: underline;">{{ l }}</a></sc-for>
  <span style="margin-left: auto; min-height: 32px; display: inline-flex; align-items: center; gap: 6px;"><i class="ti ti-eye-off"></i>Kein Tracking · EU-Hosting</span>
  <img src="../../../public/icons/powered-by-bgg.png" alt="Powered by BGG" style="height: 22px; width: auto;">
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:56},&quot;phone&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return { links: ['FAQ', 'Kontakt', 'Impressum', 'Datenschutz', 'Nutzungsbedingungen'], pad: this.props.phone ? '10px 18px 14px' : '8px 40px 12px' };
  }
}
</script>
</body>
</html>
