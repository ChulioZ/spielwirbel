<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="../../../public/fonts/tabler-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Alegreya+Sans:wght@400;700;800&display=swap" rel="stylesheet">
</helmet>
<div style="display: flex; flex-direction: column; width: 100%; font-family: 'Alegreya Sans', sans-serif; color: #1b2a18;">
  <div style="display: flex; align-items: center; gap: 18px; height: 60px; padding: 0 24px 0 28px; background: #f9fbf4; border-bottom: 1px solid #d5ddca;">
    <a href="#" style="display: inline-flex; align-items: center; gap: 10px; min-height: 44px; color: #1b2a18;" style-focus="outline: 3px solid #1b2a18; outline-offset: 2px; border-radius: 12px;"><span style="width: 34px; height: 34px; border-radius: 50%; background: #356427; color: #f4f8ec; display: grid; place-items: center;"><i class="ti ti-tornado" style="font-size: 18px;"></i></span><span style="font-family: 'Young Serif'; font-weight: 400; font-size: 21px;">Spielwirbel</span></a>
    <span style="font-size: 15px; font-weight: 700; color: #4b5c45; white-space: nowrap;">{{ crumb }}</span>
    <span style="margin-left: auto; display: flex; align-items: center; gap: 6px;">
      <a href="#" aria-label="Sprache: Deutsch" style="min-height: 44px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; border-radius: 999px; font-weight: 700; font-size: 14px; color: #1b2a18;" style-hover="background: #d6e4c6;" style-focus="outline: 3px solid #1b2a18; outline-offset: 2px;"><i class="ti ti-world" style="font-size: 18px;"></i>Deutsch<i class="ti ti-chevron-down" style="font-size: 13px;"></i></a>
      <a href="#" aria-label="Postfach, 2 neu" style="min-height: 44px; display: inline-flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 999px; font-weight: 700; font-size: 14px; color: #1b2a18;" style-hover="background: #d6e4c6;" style-focus="outline: 3px solid #1b2a18; outline-offset: 2px;"><i class="ti ti-mail" style="font-size: 18px;"></i>Postfach<span style="min-width: 20px; padding: 1px 6px; border-radius: 999px; background: #356427; color: #f4f8ec; font-size: 12px; font-weight: 800; text-align: center; box-sizing: border-box;">2</span></a>
      <a href="#" style="min-height: 44px; display: inline-flex; align-items: center; gap: 8px; padding: 0 6px 0 8px; border-radius: 999px; font-weight: 700; font-size: 14px; color: #1b2a18;" style-hover="background: #d6e4c6;" style-focus="outline: 3px solid #1b2a18; outline-offset: 2px;"><span style="width: 32px; height: 32px; border-radius: 50%; background: #f9fbf4; border: 4px solid #c6522c; box-sizing: border-box; display: grid; place-items: center; font-weight: 800; font-size: 12px;">M</span>Marco</a>
    </span>
  </div>
  <sc-if value="{{ hasSections }}" hint-placeholder-val="{{ true }}">
    <nav aria-label="Bereiche der Runde" style="display: flex; align-items: stretch; gap: 4px; height: 48px; padding: 0 28px; background: #f3f6ec; border-bottom: 1px solid #d5ddca;">
      <sc-for list="{{ sections }}" as="s" hint-placeholder-count="5">
        <a href="#" aria-current="{{ s.current }}" style="display: inline-flex; align-items: center; gap: 8px; padding: 0 14px; margin-left: {{ s.ml }}; font-weight: 700; font-size: 15px; color: {{ s.ink }}; box-shadow: inset 0 -3px 0 {{ s.line }};" style-hover="color: #1b2a18; box-shadow: inset 0 -3px 0 #6f7f66;" style-focus="outline: 3px solid #1b2a18; outline-offset: -3px;"><i class="ti {{ s.icon }}" style="font-size: 17px;"></i>{{ s.label }}<sc-if value="{{ s.hasCount }}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; font-weight: 800; padding: 1px 7px; border-radius: 999px; background: #d6e4c6; color: #1b2a18;">{{ s.count }}</span></sc-if></a>
      </sc-for>
    </nav>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:110},&quot;crumb&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Meine Runden › Donnerstagsrunde&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;start&quot;,&quot;regal&quot;,&quot;chronik&quot;,&quot;pokale&quot;,&quot;einstellungen&quot;,&quot;session&quot;,&quot;none&quot;],&quot;default&quot;:&quot;start&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;counts&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'start';
    const defs = [['start', 'Start', 'ti-trees', ''], ['regal', 'Regal', 'ti-cards', '12'], ['chronik', 'Chronik', 'ti-history', '23'], ['pokale', 'Pokale', 'ti-trophy', ''], ['einstellungen', 'Einstellungen', 'ti-settings', '']];
    const sections = defs.map(([k, label, icon, count]) => ({
      label, icon, count: this.props.counts === false ? '' : count, hasCount: this.props.counts !== false && !!count,
      ink: k === a ? '#1b2a18' : '#4b5c45', line: k === a ? '#356427' : 'transparent', current: k === a ? 'page' : 'false', ml: k === 'einstellungen' ? 'auto' : '0',
    }));
    return { crumb: this.props.crumb ?? 'Meine Runden › Donnerstagsrunde', hasSections: a !== 'none', sections };
  }
}
</script>
</body>
</html>
