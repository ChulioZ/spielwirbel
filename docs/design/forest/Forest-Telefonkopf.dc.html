<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="../../../public/fonts/tabler-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Alegreya+Sans:wght@400;700;800&display=swap" rel="stylesheet">
</helmet>
<div style="display: flex; flex-direction: column; width: 100%; font-family: 'Alegreya Sans', sans-serif; color: #1b2a18; background: #f9fbf4;">
  <div style="height: 40px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; font-weight: 800; font-size: 14px;"><span>9:41</span><span style="display: flex; gap: 6px; font-size: 16px;"><i class="ti ti-activity"></i><i class="ti ti-percentage"></i></span></div>
  <div style="height: 52px; display: flex; align-items: center; padding: 0 6px 0 16px; border-bottom: 1px solid #d5ddca;">
    <a href="#" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; color: #1b2a18;"><span style="width: 30px; height: 30px; border-radius: 50%; background: #356427; color: #f4f8ec; display: grid; place-items: center;"><i class="ti ti-tornado" style="font-size: 16px;"></i></span><span style="font-family: 'Young Serif'; font-weight: 400; font-size: 19px;">Spielwirbel</span></a>
    <span style="margin-left: auto; display: flex;">
      <a href="#" aria-label="Sprache: Deutsch" style="min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 3px; font-weight: 800; font-size: 13px; color: #1b2a18;"><i class="ti ti-world" style="font-size: 20px;"></i>{{ lang }}</a>
      <a href="#" aria-label="Postfach, 2 neu" style="position: relative; min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; color: #1b2a18;"><i class="ti ti-mail" style="font-size: 22px;"></i><span style="position: absolute; top: 4px; right: 2px; min-width: 18px; padding: 1px 5px; border-radius: 999px; background: #356427; color: #f4f8ec; font-weight: 800; font-size: 11px; box-sizing: border-box; text-align: center;">2</span></a>
      <a href="#" aria-label="Konto: Marco" style="min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center;"><span style="width: 30px; height: 30px; border-radius: 50%; background: #f9fbf4; border: 4px solid #c6522c; box-sizing: border-box; display: grid; place-items: center; font-weight: 800; font-size: 11px; color: #1b2a18;">M</span></a>
    </span>
  </div>
  <sc-if value="{{ hasRow }}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; align-items: center; gap: 6px; min-height: 48px; padding: 0 16px 0 4px; background: #f3f6ec; border-bottom: 1px solid #d5ddca;">
      <sc-if value="{{ hasBack }}" hint-placeholder-val="{{ true }}"><a href="#" style="min-height: 44px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; font-weight: 700; font-size: 15px; color: #1b2a18;"><i class="ti ti-arrow-left" style="font-size: 18px;"></i>{{ back }}</a></sc-if>
      <span style="margin-left: auto; font-weight: 700; font-size: 14px; color: #4b5c45; text-align: right;">{{ crumb }}</span>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:140},&quot;back&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;crumb&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;lang&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;DE&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const back = this.props.back ?? '';
    const crumb = this.props.crumb ?? '';
    return { back, crumb, hasBack: !!back, hasRow: !!(back || crumb), lang: this.props.lang ?? 'DE' };
  }
}
</script>
</body>
</html>
