<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="../../../public/fonts/tabler-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;700&display=swap" rel="stylesheet">
</helmet>
<div style="display: flex; flex-direction: column; width: 100%; font-family: 'Archivo', sans-serif; color: #141414;">
  <div style="display: flex; align-items: center; gap: 24px; height: 56px; padding: 0 32px 0 40px; background: #e8451c; color: #141414;">
    <a href="#" style="display: inline-flex; align-items: center; gap: 10px; min-height: 44px; font-family: 'Anton'; font-weight: 400; font-size: 24px; letter-spacing: .2em; text-transform: uppercase; color: #141414;" style-focus="outline: 3px solid #141414; outline-offset: 2px;"><i class="ti ti-tornado" style="font-size: 24px;"></i>Spielwirbel</a>
    <span style="font-weight: 700; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; white-space: nowrap;">{{ crumb }}</span>
    <span style="margin-left: auto; display: flex; align-items: center; gap: 4px;">
      <a href="#" aria-label="Sprache: Deutsch" style="min-height: 44px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; font-weight: 700; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: #141414;" style-hover="text-decoration: underline; text-decoration-thickness: 2px;" style-focus="outline: 3px solid #141414; outline-offset: -3px;"><i class="ti ti-world" style="font-size: 18px;"></i>DE<i class="ti ti-chevron-down" style="font-size: 14px;"></i></a>
      <a href="#" style="min-height: 44px; display: inline-flex; align-items: center; gap: 8px; padding: 0 10px; font-weight: 700; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: #141414;" style-hover="text-decoration: underline; text-decoration-thickness: 2px;" style-focus="outline: 3px solid #141414; outline-offset: -3px;"><i class="ti ti-mail" style="font-size: 18px;"></i>Postfach<span style="background: #141414; color: #fbfaf6; font-size: 12px; letter-spacing: 0; padding: 2px 7px;">2</span></a>
      <a href="#" style="min-height: 44px; display: inline-flex; align-items: center; gap: 8px; padding: 0 0 0 10px; font-weight: 700; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: #141414;" style-hover="text-decoration: underline; text-decoration-thickness: 2px;" style-focus="outline: 3px solid #141414; outline-offset: -3px;"><span style="width: 32px; height: 32px; background: #141414; color: #fbfaf6; display: grid; place-items: center; font-size: 15px; letter-spacing: 0;">M</span>Marco</a>
    </span>
  </div>
  <sc-if value="{{ hasSections }}" hint-placeholder-val="{{ true }}">
    <nav aria-label="Abschnitte der Runde" style="display: flex; align-items: stretch; gap: 28px; height: 44px; padding: 0 40px; background: #fbfaf6; border-bottom: 1px solid #141414;">
      <sc-for list="{{ sections }}" as="s" hint-placeholder-count="5">
        <a href="#" aria-current="{{ s.current }}" style="display: inline-flex; align-items: center; gap: 7px; padding-top: 4px; font-weight: 700; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: #141414; border-bottom: 4px solid {{ s.line }};" style-hover="border-bottom-color: #141414;" style-focus="outline: 3px solid #141414; outline-offset: 2px;"><i class="ti {{ s.icon }}" style="font-size: 16px;"></i>{{ s.label }}</a>
      </sc-for>
      <span style="margin-left: auto; display: inline-flex; align-items: center; font-weight: 600; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #6f6b66;">{{ note }}</span>
    </nav>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:100},&quot;crumb&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Meine Runden → Donnerstagsrunde&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;start&quot;,&quot;regal&quot;,&quot;chronik&quot;,&quot;pokale&quot;,&quot;einstellungen&quot;,&quot;session&quot;,&quot;none&quot;],&quot;default&quot;:&quot;start&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;note&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'start';
    const defs = [['start', 'Start', 'ti-home'], ['regal', 'Regal', 'ti-cards'], ['chronik', 'Chronik', 'ti-history'], ['pokale', 'Pokale', 'ti-trophy'], ['einstellungen', 'Einstellungen', 'ti-settings']];
    const sections = defs.map(([k, label, icon]) => ({ label, icon, line: k === a ? '#141414' : 'transparent', current: k === a ? 'page' : 'false' }));
    return { crumb: this.props.crumb ?? 'Meine Runden → Donnerstagsrunde', hasSections: a !== 'none', sections, note: this.props.note ?? '' };
  }
}
</script>
</body>
</html>
