<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;700&display=swap" rel="stylesheet">
</helmet>
<footer style="display: flex; flex-wrap: wrap; align-items: center; gap: 0 18px; width: 100%; box-sizing: border-box; padding: {{ pad }}; border-top: 1px solid #141414; background: #fbfaf6; font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #141414;">
  <sc-for list="{{ links }}" as="l" hint-placeholder-count="5"><a href="#" style="min-height: 32px; display: inline-flex; align-items: center; color: #141414;" style-hover="text-decoration: underline; text-decoration-thickness: 2px;">{{ l }}</a></sc-for>
  <span style="margin-left: auto; min-height: 32px; display: inline-flex; align-items: center; font-weight: 600; color: #6f6b66;">Kein Tracking · EU-Hosting</span>
  <img src="../../../public/icons/powered-by-bgg.png" alt="Powered by BGG" style="height: 22px; width: auto;">
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:60},&quot;phone&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return { links: ['FAQ', 'Kontakt', 'Impressum', 'Datenschutz', 'Nutzungsbedingungen'], pad: this.props.phone ? '10px 18px 14px' : '10px 40px 14px' };
  }
}
</script>
</body>
</html>
