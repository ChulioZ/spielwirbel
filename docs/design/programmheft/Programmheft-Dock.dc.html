<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="../../../public/fonts/tabler-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;700&display=swap" rel="stylesheet">
</helmet>
<nav aria-label="Runde" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); height: 64px; width: 100%; background: #fbfaf6; border-top: 3px solid #141414; font-family: 'Archivo', sans-serif;">
  <sc-for list="{{ items }}" as="d" hint-placeholder-count="4">
    <a href="#" aria-current="{{ d.current }}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 44px; background: {{ d.bg }}; color: {{ d.ink }}; font-weight: 700; font-size: 12px; letter-spacing: .1em; text-transform: uppercase;" style-focus="outline: 3px solid #e8451c; outline-offset: -3px;"><i class="ti {{ d.icon }}" style="font-size: 22px;"></i>{{ d.label }}</a>
  </sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:64},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;start&quot;,&quot;regal&quot;,&quot;chronik&quot;,&quot;pokale&quot;,&quot;none&quot;],&quot;default&quot;:&quot;start&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;labels&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'start';
    const custom = (this.props.labels || '').split(',').map((s) => s.trim()).filter(Boolean);
    const items = [['start', 'Start', 'ti-home'], ['regal', 'Regal', 'ti-cards'], ['chronik', 'Chronik', 'ti-history'], ['pokale', 'Pokale', 'ti-trophy']].map(([k, de, icon], i) => [k, custom[i] || de, icon]).map(([k, label, icon]) => ({
      label, icon, current: k === a ? 'page' : 'false', bg: k === a ? '#141414' : '#fbfaf6', ink: k === a ? '#fbfaf6' : '#141414',
    }));
    return { items };
  }
}
</script>
</body>
</html>
