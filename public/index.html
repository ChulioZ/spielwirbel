<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Descriptive on purpose (#436): this is the SERP headline and the tab /
       bookmark label, and the bare brand word taught a first-time visitor
       nothing. Brand first so a truncated tab still reads "Spielwirbel…".
       Static German like the og tags below — a crawler runs no JS and has no
       locale, so this is deliberately outside i18n. -->
  <title>Spielwirbel – Spiele sammeln, abstimmen und bewerten</title>
  <meta name="description" content="Brettspiele und Videospiele an einem Ort – mit Abstimmung, was heute gespielt wird, und Chronik, wie’s war." />
  <!-- Link preview (issue #430): what a messenger/social scraper shows when the
       link is shared. These are STATIC on purpose:
       - Scrapers do not run JS, so nothing views-landing.js renders is visible
         to them — the card has to live in the served HTML.
       - This one document is also the SPA fallback for every deep link, so a
         shared /round/… URL shows this same generic card. That is deliberate:
         round, member and game names are private tenant data and must never
         end up in a preview scraped by a third party.
       - The URLs are absolute because several scrapers (WhatsApp among them)
         do not resolve a root-relative og:image. The origin is the canonical
         host from lib/canonical.js (#230) — every branded domain 301s there.
         A fork self-hosting under another domain edits it here. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Spielwirbel" />
  <meta property="og:locale" content="de_DE" />
  <meta property="og:url" content="https://spielwirbel.app/" />
  <meta property="og:title" content="Spielwirbel – Die Spielesammlung für eure Runde." />
  <meta property="og:description" content="Brettspiele und Videospiele an einem Ort – mit Abstimmung, was heute gespielt wird, und Chronik, wie’s war." />
  <meta property="og:image" content="https://spielwirbel.app/icons/og-image.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Spielwirbel – das Wirbel-Logo auf orangem Grund" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Spielwirbel – Die Spielesammlung für eure Runde." />
  <meta name="twitter:description" content="Brettspiele und Videospiele an einem Ort – mit Abstimmung, was heute gespielt wird, und Chronik, wie’s war." />
  <meta name="twitter:image" content="https://spielwirbel.app/icons/og-image.png" />
  <!-- Every SPA route is served from this document; the routes behind the login
       hold private data and are not indexable anyway, so the canonical is the
       public front door. -->
  <link rel="canonical" href="https://spielwirbel.app/" />
  <!-- PWA (issue #142): installable + offline. theme-color matches --brand. -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#c2410c" />
  <link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Spielwirbel" />
  <meta name="mobile-web-app-capable" content="yes" />
  <!-- Root-absolute paths so assets resolve on nested routes (e.g.
       /round/:rid/regal), which the server serves index.html for. -->
  <link rel="stylesheet" href="/fonts/tabler-icons.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <a id="homeBtn" class="topbar__home" href="/" aria-label="Home"><i class="ti ti-tornado" aria-hidden="true"></i></a>
    <div id="context" class="topbar__context"></div>
    <select id="langPicker" class="lang-picker" aria-label="Language"></select>
    <!-- Support link (issue #173): hidden until GET /api/config reports a
         donateUrl; wired by js/support.js. -->
    <button id="supportBtn" class="topbar__acct" type="button" hidden aria-label="Support"><i class="ti ti-heart" aria-hidden="true"></i></button>
    <!-- Feedback (issues #260/#321): hidden until GET /api/config reports the
         contact channel is configured (same footer gate); initFooter() in
         core.js reveals it and wires it to open the contact form with the
         Feedback category preselected. -->
    <button id="feedbackBtn" class="topbar__acct" type="button" hidden aria-label="Feedback"><i class="ti ti-message" aria-hidden="true"></i></button>
    <!-- Inbox (issue #207): the per-user notification inbox. Hidden unless
         accounts are on and the user is logged in; wired by js/account.js
         setupAccountUi(). Its items (round invitations #207, friend requests
         #325) arrive in later slices, so it ships empty. -->
    <button id="inboxBtn" class="topbar__acct" type="button" hidden aria-label="Postfach"><i class="ti ti-mail" aria-hidden="true"></i><span id="inboxDot" class="inbox-dot" hidden></span></button>
    <!-- Account menu (issue #138): hidden unless accounts are on and the user is
         logged in; wired by js/account.js setupAccountUi(). -->
    <button id="accountBtn" class="topbar__acct" type="button" hidden aria-label="Account"><i class="ti ti-user" aria-hidden="true"></i></button>
  </header>

  <main id="app" class="app">
    <!-- Content is rendered by the js/* files -->
  </main>

<!-- Shared site footer, two independent parts:
       - Kontakt + the legal pages (issues #224/#134), hidden until GET
         /api/config says the surfaces behind them are configured (initFooter()
         in core.js) — all-or-nothing, so a half-ready instance shows no links
         rather than broken ones (the legal routes 404 under the same condition);
       - the "Powered by BGG" attribution (#117), deliberately NOT gated: BGG's
         XML API terms require a public-facing application to display the logo,
         linked back to BoardGameGeek, at a size that keeps its text easily
         legible. Self-hosted rather than hotlinked, so rendering it contacts
         nobody (unlike the hotlinked game covers disclosed in the policy).
       Root-absolute paths per
       .claude/rules/spa-fallback-absolute-asset-paths.md; link labels are set in
       applyStaticTexts() so they re-localize on language change. -->
  <footer class="site-footer" role="contentinfo">
   <!-- The footer is a full-bleed tinted band (#326); this inner wrapper carries
        the centred content column so its width lines up with .app above it. -->
   <div class="site-footer__inner">
    <div class="site-footer__links" id="footerLinks" hidden>
      <!-- These pages live outside the SPA; open them in a new tab so a footer
           click doesn't tear down app state (#390, matching the register
           screen's target="_blank" on the same pages in account.js). -->
      <a href="/kontakt.html" id="footerKontakt" target="_blank" rel="noopener"></a>
      <a href="/impressum" id="footerImpressum" target="_blank" rel="noopener"></a>
      <a href="/datenschutz" id="footerPrivacy" target="_blank" rel="noopener"></a>
      <a href="/nutzungsbedingungen" id="footerTerms" target="_blank" rel="noopener"></a>
    </div>
    <!-- Trust claims (#323): two verifiable statements — EU hosting / GDPR and
         no tracking/ads/third-party scripts. Gated on the SAME cfg.footer flag
         as the links (initFooter in core.js): the EU-hosting claim is only true
         on the operator's configured instance, so a self-hoster shows nothing.
         Labels set in applyStaticTexts() so they re-localize on language change.
         Starts hidden; the [hidden] guard in styles.css beats the flex display
         (.claude/rules/hidden-attribute-vs-display-rule.md). -->
    <div class="site-footer__trust" id="footerTrust" hidden>
      <span class="site-footer__trust-item">
        <i class="ti ti-shield" aria-hidden="true"></i>
        <span id="footerTrustHosting"></span>
      </span>
      <span class="site-footer__trust-item">
        <i class="ti ti-eye-off" aria-hidden="true"></i>
        <span id="footerTrustNoTracking"></span>
      </span>
    </div>
    <a class="site-footer__bgg" href="https://boardgamegeek.com" target="_blank" rel="noopener noreferrer">
      <img src="/icons/powered-by-bgg.png" width="900" height="264" alt="Powered by BGG" />
    </a>
   </div>
  </footer>

  <!-- Small toast for feedback. A permanent aria-live region (#145): it stays in
       the accessibility tree and is shown/hidden with a class, because a live
       region that only appears together with its text is never announced. -->
  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <!-- Order matters: i18n + languages first, core next, main (bootstrap) last. -->
  <script src="/js/i18n.js"></script>
  <script src="/js/lang/en.js"></script>
  <script src="/js/lang/de.js"></script>
  <script src="/js/cover.js"></script>
  <script src="/js/cover-size.js"></script>
  <script src="/js/tag-icons.js"></script>
  <script src="/js/swr.js"></script>
  <script src="/js/focus-trap.js"></script>
  <script src="/js/session-path.js"></script>
  <script src="/js/nav-link.js"></script>
  <script src="/js/auth-error.js"></script>
  <script src="/js/member-colors.js"></script>
  <script src="/js/session-people.js"></script>
  <script src="/js/core.js"></script>
  <script src="/js/account.js"></script>
  <script src="/js/ranking.js"></script>
  <script src="/js/lookup-group.js"></script>
  <script src="/js/lookup-cover.js"></script>
  <script src="/js/lookup-score.js"></script>
  <script src="/js/lookup-title.js"></script>
  <script src="/js/support.js"></script>
  <script src="/js/round-rail.js"></script>
  <script src="/js/views-landing.js"></script>
  <script src="/js/views-home.js"></script>
  <script src="/js/views-round.js"></script>
  <script src="/js/views-round-tabs.js"></script>
  <script src="/js/views-round-detail.js"></script>
  <script src="/js/views-round-lookup.js"></script>
  <script src="/js/views-member.js"></script>
  <script src="/js/views-session.js"></script>
  <script src="/js/views-inbox.js"></script>
  <script src="/js/views-friends.js"></script>
  <script src="/js/router.js"></script>
  <script src="/js/main.js"></script>
  <!-- Registers the service worker; standalone IIFE, order-independent. -->
  <script src="/js/pwa.js"></script>
</body>
</html>
