<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Descriptive on purpose (#436): this is the SERP headline and the tab /
       bookmark label, and the bare brand word taught a first-time visitor
       nothing. Brand first so a truncated tab still reads "Spielwirbel…".
       Static German like the og tags below — a crawler runs no JS and has no
       locale, so this is deliberately outside i18n. -->
  <title>Spielwirbel – Was spielen wir heute? Abstimmen und bewerten</title>
  <meta name="description" content="Ein Gerät wandert um den Tisch, alle bewerten die ausgelosten Spiele. Heraus kommt das Spiel für heute – und mit jeder Session ein schärferes Bild davon, was eure Runde gern spielt." />
  <!-- Link preview (issue #430): what a messenger/social scraper shows when the
       link is shared. These are STATIC on purpose:
       - Scrapers do not run JS, so nothing views-landing.js renders is visible
         to them — the card has to live in the served HTML.
       - This one document is also the SPA fallback for every deep link, so a
         shared /round/… URL shows this same generic card. That is deliberate:
         round, member and game names are private tenant data and must never
         end up in a preview scraped by a third party.
       - The URLs are absolute because several scrapers (WhatsApp among them)
         do not resolve a root-relative og:image. The origin is the canonical
         host from lib/canonical.js (#230) — every branded domain 301s there.
         A fork self-hosting under another domain edits it here. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Spielwirbel" />
  <meta property="og:locale" content="de_DE" />
  <meta property="og:url" content="https://spielwirbel.app/" />
  <meta property="og:title" content="Spielwirbel – Was spielen wir heute?" />
  <meta property="og:description" content="Ein Gerät wandert um den Tisch, alle bewerten die ausgelosten Spiele. Heraus kommt das Spiel für heute – und mit jeder Session ein schärferes Bild davon, was eure Runde gern spielt." />
  <meta property="og:image" content="https://spielwirbel.app/icons/og-image.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Spielwirbel – das Wirbel-Logo auf orangem Grund" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Spielwirbel – Was spielen wir heute?" />
  <meta name="twitter:description" content="Ein Gerät wandert um den Tisch, alle bewerten die ausgelosten Spiele. Heraus kommt das Spiel für heute – und mit jeder Session ein schärferes Bild davon, was eure Runde gern spielt." />
  <meta name="twitter:image" content="https://spielwirbel.app/icons/og-image.png" />
  <!-- Every SPA route is served from this document; the routes behind the login
       hold private data and are not indexable anyway, so the canonical is the
       public front door. -->
  <link rel="canonical" href="https://spielwirbel.app/" />
  <!-- PWA (issue #142): installable + offline. theme-color matches --brand —
       the value below is the standard accent, and applyBackground() (core.js)
       moves it to the round's accent and back (#523). -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#c2410c" />
  <link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Spielwirbel" />
  <meta name="mobile-web-app-capable" content="yes" />
  <!-- Root-absolute paths so assets resolve on nested routes (e.g.
       /round/:rid/regal), which the server serves index.html for. -->
  <link rel="stylesheet" href="/fonts/tabler-icons.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <a id="homeBtn" class="topbar__home" href="/" aria-label="Home"><i class="ti ti-tornado" aria-hidden="true"></i></a>
    <div id="context" class="topbar__context"></div>
    <select id="langPicker" class="lang-picker" aria-label="Language"></select>
    <!-- Support link (issue #173): hidden until GET /api/config reports a
         donateUrl; wired by js/support.js. -->
    <button id="supportBtn" class="topbar__acct" type="button" hidden aria-label="Support"><i class="ti ti-heart" aria-hidden="true"></i></button>
    <!-- Feedback (issues #260/#321): hidden until GET /api/config reports the
         contact channel is configured (same footer gate); initFooter() in
         core.js reveals it and wires it to open the contact form with the
         Feedback category preselected. -->
    <button id="feedbackBtn" class="topbar__acct" type="button" hidden aria-label="Feedback"><i class="ti ti-message" aria-hidden="true"></i></button>
    <!-- Inbox (issue #207): the per-user notification inbox. Hidden unless
         accounts are on and the user is logged in; wired by js/account.js
         setupAccountUi(). Its items (round invitations #207, friend requests
         #325) arrive in later slices, so it ships empty. -->
    <button id="inboxBtn" class="topbar__acct" type="button" hidden aria-label="Postfach"><i class="ti ti-mail" aria-hidden="true"></i><span id="inboxDot" class="topbar-dot" hidden></span></button>
    <!-- Account menu (issue #138): hidden unless accounts are on and the user is
         logged in; wired by js/account.js setupAccountUi(). -->
    <button id="accountBtn" class="topbar__acct" type="button" hidden aria-label="Account"><i class="ti ti-user" aria-hidden="true"></i><span id="newsDot" class="topbar-dot" hidden></span></button>
  </header>

  <!-- No-JS fallback (issue #525). Everything below the static hero is rendered
       by js/*, so with scripting off a visitor gets that hero and then a page
       where nothing responds — previously with no explanation anywhere.

       Hardcoded in both shipped languages because localizing it would need the
       one thing that is missing: i18n.js. `lang="de"` on the German line
       because this document declares `lang="en"` and i18n.js — which normally
       corrects it — never runs here, so without the attribute a screen reader
       pronounces German with English phonetics.

       Outside the app's main element on purpose: showLanding() overwrites that
       block on boot, and test/seo.test.js scopes its crawlable-hero assertion
       to it (.claude/rules/noindex-vs-disallow-and-the-crawler-surface.md §3).
       Spelled without the literal tag here because test/seo.test.js still
       extracts that block with a raw-text regex, and a comment naming the tag
       is matched ahead of the real element
       (.claude/rules/css-text-assertions-strip-comments.md).

       Unlike the two banners below this needs no `[hidden]` companion rule in
       styles.css. With scripting ENABLED the parser never turns this markup
       into elements at all — it stores it as a single text node — so
       .noscript-banner does not exist and no author rule can reach it. That is
       a stronger guarantee than the `hidden` attribute's, which any `display`
       rule overrides (.claude/rules/hidden-attribute-vs-display-rule.md). -->
  <noscript>
    <div class="noscript-banner">
      <p lang="de">Spielwirbel benötigt JavaScript.</p>
      <p>Spielwirbel requires JavaScript.</p>
    </div>
  </noscript>

  <!-- Guest demo marker (issue #427): states that this account is a throwaway
       demo that will be deleted, and offers registration. Permanently in the
       tree and toggled with the `hidden` attribute by setupDemoBanner()
       (js/account.js) — which is why styles.css must carry an explicit
       `.demo-banner[hidden] { display: none }`: the attribute only hides via the
       UA stylesheet, so the component's own `display` would otherwise win and
       show this to every visitor
       (.claude/rules/hidden-attribute-vs-display-rule.md). -->
  <div class="demo-banner" id="demoBanner" hidden>
    <i class="ti ti-clock" aria-hidden="true"></i>
    <span class="demo-banner__text" id="demoBannerText"></span>
    <!-- Express reference to the Nutzungsbedingungen (#520). A demo account is
         created without registration, so the register form's terms line never
         runs for these users — this banner is the only surface both demo entry
         points share (the landing CTA and the /demo deep link, which bootApp()
         handles without ever rendering the landing page). Ships `hidden` and is
         revealed by setupDemoBanner() only when GET /api/config reports
         `footer`, because /nutzungsbedingungen hard-404s until the operator
         identity is configured — hence the paired
         `.demo-banner__terms[hidden]` rule in styles.css. -->
    <a class="demo-banner__terms" id="demoBannerTerms" href="/nutzungsbedingungen"
       target="_blank" rel="noopener" hidden></a>
    <button class="demo-banner__cta" id="demoBannerCta" type="button"></button>
  </div>

  <!-- Terms-change notice (issue #521): delivers the in-service notification
       Nutzungsbedingungen §11 promises, shown when the account's stored
       acceptedTermsRevision is behind the server's current one. A SIBLING of the
       demo banner rather than a shared component: that one's `body.auth-screen`
       hide rule and register-CTA behaviour are load-bearing, and the two say
       unrelated things.

       Same `hidden`-attribute trap as the banner above — it needs its own
       explicit `.terms-banner[hidden] { display: none }` in styles.css, or the
       component's `display` wins and every visitor sees it
       (.claude/rules/hidden-attribute-vs-display-rule.md). The link ships hidden
       too and is revealed only where /nutzungsbedingungen resolves. -->
  <div class="terms-banner" id="termsBanner" hidden>
    <i class="ti ti-file-text" aria-hidden="true"></i>
    <span class="terms-banner__text" id="termsBannerText"></span>
    <!-- Deep-links to the „Änderungshistorie" section, not to the top of the
         document: the label promises the CHANGES, so landing the reader on 1000
         unchanged lines would be a label that lies. setupTermsBanner() swaps the
         fragment for the reader's own locale (the page carries a DE and an EN
         section); this static value is the DE fallback. -->
    <a class="terms-banner__link" id="termsBannerLink" href="/nutzungsbedingungen#aenderungen"
       target="_blank" rel="noopener" hidden></a>
    <button class="terms-banner__dismiss" id="termsBannerDismiss" type="button"></button>
  </div>

  <main id="app" class="app">
    <!-- Content is rendered by the js/* files. The one exception is the hero
         below (#510): everything on the landing page comes from
         js/views-landing.js, so the served HTML carried no body text at all and
         a crawler that runs no JS saw an empty document — which is why the
         search result stayed on the retired login screen instead of moving here.
         showLanding() overwrites this on boot, so the JS path is unchanged.

         German only, like <title> and the og tags above: a crawler has no
         locale. It deliberately carries NO config-gated claim — not the
         operator-only EU-hosting chip, not the demo CTA. Static markup cannot be
         gated on GET /api/config, and publishing an operator claim on a
         self-hoster's instance is exactly what
         .claude/rules/hidden-attribute-vs-display-rule.md exists to prevent.
         The three strings are duplicated from lang/de.js with no way to share
         them (index.html is static, with no templating), so
         test/landing-copy.test.js pins them against the lang table — that
         parity test is the licence for the copy
         (.claude/rules/shared-constants-across-the-stack.md). -->
    <div class="landing">
      <section class="landing-hero">
        <div class="landing-hero__text">
          <div class="landing-hero__brand">
            <i class="ti ti-tornado" aria-hidden="true"></i><span>Spielwirbel</span>
          </div>
          <h1 class="landing-hero__title">Was spielen wir heute?</h1>
          <p class="landing-hero__sub">Ein Gerät wandert um den Tisch, alle bewerten die ausgelosten Spiele. Heraus kommt das Spiel für heute – und mit jeder Session ein schärferes Bild davon, was eure Runde gern spielt.</p>
        </div>
      </section>
    </div>
  </main>

<!-- Shared site footer, two independent parts:
       - Kontakt + the legal pages (issues #224/#134), hidden until GET
         /api/config says the surfaces behind them are configured (initFooter()
         in core.js) — all-or-nothing, so a half-ready instance shows no links
         rather than broken ones (the legal routes 404 under the same condition);
       - the "Powered by BGG" attribution (#117), deliberately NOT gated: BGG's
         XML API terms require a public-facing application to display the logo,
         linked back to BoardGameGeek, at a size that keeps its text easily
         legible. Self-hosted rather than hotlinked, so rendering it contacts
         nobody (unlike the hotlinked game covers disclosed in the policy).
       Root-absolute paths per
       .claude/rules/spa-fallback-absolute-asset-paths.md; link labels are set in
       applyStaticTexts() so they re-localize on language change. -->
  <footer class="site-footer" role="contentinfo">
   <!-- The footer is a full-bleed tinted band (#326); this inner wrapper carries
        the centred content column so its width lines up with .app above it. -->
   <div class="site-footer__inner">
    <div class="site-footer__links" id="footerLinks" hidden>
      <!-- These pages live outside the SPA; open them in a new tab so a footer
           click doesn't tear down app state (#390, matching the register
           screen's target="_blank" on the same pages in account.js). -->
      <!-- The FAQ (#489) rides the same cfg.footer gate as its neighbours even
           though GET /faq itself never 404s. That is deliberate: this row is
           all-or-nothing, and an unconfigured instance still reaches the page
           from the landing screen's ungated link, so nothing becomes
           unreachable — only this one entry point waits for the gate. -->
      <a href="/faq" id="footerFaq" target="_blank" rel="noopener"></a>
      <a href="/kontakt.html" id="footerKontakt" target="_blank" rel="noopener"></a>
      <a href="/impressum" id="footerImpressum" target="_blank" rel="noopener"></a>
      <a href="/datenschutz" id="footerPrivacy" target="_blank" rel="noopener"></a>
      <a href="/nutzungsbedingungen" id="footerTerms" target="_blank" rel="noopener"></a>
    </div>
    <!-- Trust claims (#323): two verifiable statements — EU hosting / GDPR and
         no tracking/ads/third-party scripts. Gated on the SAME cfg.footer flag
         as the links (initFooter in core.js): the EU-hosting claim is only true
         on the operator's configured instance, so a self-hoster shows nothing.
         Labels set in applyStaticTexts() so they re-localize on language change.
         Starts hidden; the [hidden] guard in styles.css beats the flex display
         (.claude/rules/hidden-attribute-vs-display-rule.md). -->
    <div class="site-footer__trust" id="footerTrust" hidden>
      <span class="site-footer__trust-item">
        <i class="ti ti-shield" aria-hidden="true"></i>
        <span id="footerTrustHosting"></span>
      </span>
      <span class="site-footer__trust-item">
        <i class="ti ti-eye-off" aria-hidden="true"></i>
        <span id="footerTrustNoTracking"></span>
      </span>
    </div>
    <a class="site-footer__bgg" href="https://boardgamegeek.com" target="_blank" rel="noopener noreferrer">
      <img src="/icons/powered-by-bgg.png" width="900" height="264" alt="Powered by BGG" />
    </a>
   </div>
  </footer>

  <!-- Small toast for feedback. A permanent aria-live region (#145): it stays in

       region that only appears together with its text is never announced. -->
  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
