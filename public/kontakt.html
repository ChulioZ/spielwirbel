<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kontakt · Spielwirbel</title>
  <!-- Keep this page out of search results (#510): a thin form page that would
       otherwise compete with the landing page for the brand query. It stays
       crawl-ALLOWED in robots.txt on purpose — see the note there; the § 5 DDG
       requirement is that the channel is publicly reachable, which noindex does
       not affect. -->
  <meta name="robots" content="noindex, nofollow" />
  <!-- Linking the manifest makes this page a PWA install surface, so theme-color
       must be the manifest's own theme_color (#597) — otherwise an install from
       here tints the app chrome differently than one from the SPA or the login
       page. It used to be #f4f1ea, the app's --page-bg: defensible on its own
       terms (tint the chrome like the page), but the manifest already carries
       that value as background_color, and #523 settled the question the other
       way — the SPA's tag tracks the round ACCENT, falling back to the brand. -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#d9a951" />
  <link rel="icon" href="/icons/tisch/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="/icons/tisch/apple-touch-icon.png" />
  <!-- Standalone public contact page (issue #224), reachable WITHOUT login (it is
       the phone-free §5 DDG second channel). Intentionally independent of the
       SPA: bilingual in-page (DE authoritative + EN, toggled by /js/pages/kontakt.js),
       self-contained. Inline styles are allowed by the CSP (style-src
       'unsafe-inline'); the script must be an external file because script-src is
       'self' only. -->
  <!-- The FACE design (#1198), stamped onto <html data-design> before the body
       parses, so the page never paints Klassisch and then repaints. Both are
       'self' scripts, as the CSP requires; designs.js only declares the
       registry, and reads Ocean's markers from member-colors.js (#1219). See js/pages/face.js. -->
  <script src="/js/member-colors.js"></script>
  <script src="/js/designs.js"></script>
  <script src="/js/pages/face.js"></script>
  <style>
    /* The tokens below mirror public/styles.css so this page reads as the same
       product as the app (issue #391). They are COPIED, not imported: styles.css
       is the whole SPA and its :root carries a per-round *theme*, which this page
       has no context for — it must render for a logged-out visitor with no round.
       So the values here are the app's DEFAULTS. Keep them in step if the brand
       palette changes. */
    :root {
      --page-bg: #f4f1ea;
      --brand: #c2410c;
      --surface: #ffffff;
      --ink: #2b2620;
      --ink-soft: #6b6358;
      /* AA-checked in test/a11y-contrast.test.js against the app's themes. */
      --good: #117c38;
      --danger: #d02424;
      /* --shade names the direction the neutrals below travel away from the
         page (#904). These pages are always light, so it is always #000 here —
         it is copied along because test/standalone-page-brand.test.js compares
         the token TEXT, and a page that spelled the endpoint out would read as
         drift the moment styles.css retunes the direction. */
      --shade: #000;
      --line: color-mix(in oklab, var(--page-bg), var(--shade) 7%);
      --brand-strong: color-mix(in oklab, var(--brand), var(--shade) 13%);
      --page-glow: color-mix(in oklab, var(--brand) 7%, transparent);
      --radius-lg: 18px;
      --shadow-2: 0 2px 8px rgba(0, 0, 0, 0.08), 0 8px 24px rgba(0, 0, 0, 0.06);
      --font: "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-display-std: "Baloo 2", "Nunito", -apple-system, BlinkMacSystemFont, sans-serif;
      --font-display: var(--font-display-std);
    }
    /* DER TISCH AS THE FACE (#1198). A second copy, of Der Tisch's tokens this
       time, applied only when <html data-design="tisch"> — i.e. only once
       FACE_DESIGN (js/designs.js) names it, which it does since the flip
       (#1202); with a Klassisch face the page is exactly the one above. Every value is
       Der Tisch's own resolved token (the registry's page/accent, then
       css/designs/tisch.css, then styles.css's dark block), pinned by
       test/standalone-page-brand.test.js, which also requires this block to
       redeclare every name the Klassisch copy declares, so no Klassisch value
       leaks through. */
    :root[data-design="tisch"] {
      --page-bg: #3b2a12;
      --brand: #d9a951;
      --surface: #4a3423;
      --ink: #f6ecd8;
      --ink-soft: #e8d0aa;
      --good: #a8dcb4;
      --danger: #f59c86;
      --shade: #fff;
      --line: color-mix(in oklab, var(--page-bg), var(--shade) 21%);
      --brand-strong: color-mix(in oklab, var(--brand), var(--shade) 13%);
      --page-glow: color-mix(in oklab, var(--brand) 7%, transparent);
      --radius-lg: 6px;
      --shadow-2: 0 6px 14px var(--cast-soft), 0 1px 2px var(--cast);
      --font: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-display-std: "Baloo 2", "Nunito", -apple-system, BlinkMacSystemFont, sans-serif;
      --font-display: "Bricolage Grotesque", "Manrope", -apple-system, BlinkMacSystemFont, sans-serif;
      --radius-md: 4px;
      --on-accent: #2a1a08;
      --paper: #f8f3e7;
      --paper-ink: #2f2620;
      --paper-edge: #8d6436;
      --felt: #2f6b4d;
      --felt-deep: #1c4531;
      --felt-grain: rgba(0, 0, 0, 0.07);
      --gold: #f0cf86;
      --gold-deep: #d9a951;
      --gold-edge: #9a6d2b;
      --brass-hi: #f6d795;
      --cast: rgba(0, 0, 0, 0.35);
      --cast-soft: rgba(0, 0, 0, 0.30);
      --cast-deep: rgba(0, 0, 0, 0.45);
    }
    /* Only the three weights this page actually uses (the app declares seven).
       Same self-hosted files under /fonts/ — no new origin, so the CSP is
       untouched, and the build copies fonts through unhashed so these paths hold
       in dist/ too. */
    @font-face { font-family: 'Nunito'; font-style: normal; font-weight: 400; font-display: swap; src: url('/fonts/nunito-latin-400-normal.woff2') format('woff2'); }
    @font-face { font-family: 'Nunito'; font-style: normal; font-weight: 600; font-display: swap; src: url('/fonts/nunito-latin-600-normal.woff2') format('woff2'); }
    @font-face { font-family: 'Baloo 2'; font-style: normal; font-weight: 700; font-display: swap; src: url('/fonts/baloo-2-latin-700-normal.woff2') format('woff2'); }

    /* Der Tisch's two faces (#1198), for the face block below. Declared always,
       fetched only when a rule actually uses them — so under Klassisch not one
       of these five files is downloaded. */
    @font-face { font-family: 'Manrope'; font-style: normal; font-weight: 500; font-display: swap; src: url('/fonts/manrope-latin-500-normal.woff2') format('woff2'); }
    @font-face { font-family: 'Manrope'; font-style: normal; font-weight: 600; font-display: swap; src: url('/fonts/manrope-latin-600-normal.woff2') format('woff2'); }
    @font-face { font-family: 'Manrope'; font-style: normal; font-weight: 700; font-display: swap; src: url('/fonts/manrope-latin-700-normal.woff2') format('woff2'); }
    @font-face { font-family: 'Bricolage Grotesque'; font-style: normal; font-weight: 700; font-display: swap; src: url('/fonts/bricolage-grotesque-latin-700-normal.woff2') format('woff2'); }
    @font-face { font-family: 'Bricolage Grotesque'; font-style: normal; font-weight: 800; font-display: swap; src: url('/fonts/bricolage-grotesque-latin-800-normal.woff2') format('woff2'); }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      /* The app's backdrop: a soft accent glow falling from the top over a
         barely-there paper grain (the `body` rule in public/styles.css). */
      background-color: var(--page-bg);
      background-image:
        radial-gradient(120% 70% at 50% 0%, var(--page-glow), transparent 70%),
        url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='180'%20height='180'%3E%3Cfilter%20id='g'%20x='0'%20y='0'%20width='100%25'%20height='100%25'%3E%3CfeTurbulence%20type='fractalNoise'%20baseFrequency='0.9'%20numOctaves='2'%20seed='7'%20stitchTiles='stitch'/%3E%3CfeColorMatrix%20type='matrix'%20values='0%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200.06%200'/%3E%3C/filter%3E%3Crect%20width='100%25'%20height='100%25'%20filter='url(%23g)'/%3E%3C/svg%3E");
      background-attachment: fixed;
      color: var(--ink);
      font-family: var(--font);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      padding: 2rem 1.5rem;
    }
    .card {
      width: 100%;
      max-width: 480px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 2rem 1.75rem;
      box-shadow: var(--shadow-2);
    }
    .topline { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 0.75rem; }
    /* The app's brand lockup (mark + wordmark), so the page identifies itself as
       Spielwirbel. Deliberately not a link: /kontakt.html already carries a
       "back to the app" link in its footer, and this issue changes no behaviour. */
    .brand { display: flex; align-items: center; gap: 0.5rem; }
    .brand img { display: block; width: 32px; height: 32px; border-radius: 9px; }
    .brand span { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; color: var(--brand); }
    .langs { font-size: 0.85rem; }
    .langs button {
      background: none; border: 0; color: var(--ink-soft); cursor: pointer;
      font: inherit; padding: 0.2rem 0.35rem; border-radius: 6px;
    }
    .langs button[aria-pressed='true'] { color: var(--ink); font-weight: 600; text-decoration: underline; }
    h1 { font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; margin: 0 0 0.4rem; }
    .intro { font-size: 0.9rem; color: var(--ink-soft); margin: 0 0 1.4rem; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin: 1rem 0 0.4rem; color: var(--ink-soft); }
    /* Art. 16(2) report fields (#272): revealed by the category select. */
    .hint { font-size: 0.82rem; color: var(--ink-soft); margin: 0.75rem 0 0; }
    .check { display: flex; gap: 0.6rem; align-items: flex-start; margin-top: 1rem; }
    .check input { width: auto; margin-top: 0.2rem; }
    .check label { margin: 0; font-size: 0.85rem; }
    select, input, textarea {
      width: 100%;
      padding: 0.7rem 0.85rem;
      font-size: 1rem;
      font-family: inherit;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
    }
    textarea { min-height: 8rem; resize: vertical; }
    select:focus, input:focus, textarea:focus { outline: 2px solid var(--brand); outline-offset: 1px; border-color: var(--brand); }
    /* Honeypot: off-screen, not tab-reachable, hidden from assistive tech. Real
       users never fill it; a non-empty value is treated as a bot server-side. */
    .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
    /* The app's primary button (.btn--primary): display face, and the thick
       bottom border that "presses in" on :active. */
    button.submit {
      width: 100%;
      margin-top: 1.4rem;
      padding: 0.7rem;
      font-family: var(--font-display);
      font-size: 1.05rem;
      font-weight: 700;
      border: 1.5px solid var(--brand-strong);
      border-bottom-width: 4px;
      border-radius: 14px;
      background: var(--brand);
      color: #fff;
      cursor: pointer;
    }
    button.submit:hover { background: var(--brand-strong); }
    button.submit:active { transform: translateY(2px); border-bottom-width: 1.5px; margin-bottom: 2.5px; }
    button.submit:disabled { opacity: 0.6; cursor: default; }
    .msg { margin-top: 1rem; font-size: 0.88rem; text-align: center; }
    .msg[hidden] { display: none; }
    .msg.ok { color: var(--good); }
    .msg.err { color: var(--danger); }
    .foot { margin-top: 1.5rem; text-align: center; font-size: 0.85rem; }
    .foot a { color: var(--ink-soft); }
    /* ---- Der Tisch (#1198, T12.3) ----
       T12.3's Kontakt: a walnut card on the table, labels in the soft paper
       ink, every field printed paper with a brass edge, and „Abschicken" on
       the brass plate. The sheet's felt head band and its trimmed field list
       are NOT built — the first needs a wrapper, the second removes fields
       the Art. 16 report path depends on; this slice changes paint only. */
    :root[data-design="tisch"] body {
      background-color: var(--felt-deep);
      background-image:
        repeating-linear-gradient(48deg, var(--felt-grain) 0 2px, transparent 2px 5px),
        radial-gradient(120% 90% at 50% 0%, var(--felt), var(--felt-deep) 72%);
    }
    :root[data-design="tisch"] .card {
      border-color: var(--gold-edge);
      box-shadow: 0 18px 40px var(--cast-deep);
    }
    :root[data-design="tisch"] .brand span { color: var(--gold); font-weight: 800; }
    :root[data-design="tisch"] h1 { font-weight: 800; font-size: 1.75rem; }
    :root[data-design="tisch"] select,
    :root[data-design="tisch"] input,
    :root[data-design="tisch"] textarea {
      border-radius: var(--radius-md);
      border-color: var(--paper-edge);
      background: var(--paper);
      color: var(--paper-ink);
    }
    :root[data-design="tisch"] select:focus,
    :root[data-design="tisch"] input:focus,
    :root[data-design="tisch"] textarea:focus { outline-color: var(--gold); border-color: var(--gold-edge); }
    :root[data-design="tisch"] .check input { accent-color: var(--gold-deep); }
    :root[data-design="tisch"] .langs button[aria-pressed='true'] { color: var(--gold); }
    :root[data-design="tisch"] button.submit {
      border: 1px solid var(--gold-edge);
      border-bottom-width: 3px;
      border-radius: var(--radius-md);
      background: linear-gradient(180deg, var(--brass-hi), var(--gold-deep));
      color: var(--on-accent);
      font-weight: 800;
    }
    :root[data-design="tisch"] button.submit:hover { background: var(--gold-deep); }
    /* Review finding A7 on the footer links: a 24px target, through the box
       rather than the type, so nothing moves on the line. */
    :root[data-design="tisch"] .foot a { display: inline-block; min-height: 24px; line-height: 24px; }
  </style>
</head>
<body>
  <form class="card" id="contactForm" novalidate>
    <div class="topline">
      <div class="brand">
        <img src="/icons/tisch/icon-192.png" alt="" width="32" height="32" />
        <span>Spielwirbel</span>
      </div>
      <div class="langs" role="group" aria-label="Language">
        <button type="button" data-lang="de" aria-pressed="true">DE</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
    <h1 id="t-title">Kontakt</h1>
    <p class="intro" id="t-intro"></p>
    <!-- Names this form as the DSA content-report channel (#272 / Art. 16). -->
    <p class="intro" id="t-report-note"></p>

<!-- Wrapped so kontakt.js can hide the whole input section at once when
         GET /api/config reports the channel as not configured yet (same
         all-or-nothing gate as the site footer). -->
    <div id="formFields">
      <label for="name" id="t-name-label"></label>
      <input id="name" name="name" type="text" autocomplete="name" maxlength="200" />

      <label for="email" id="t-email-label"></label>
      <input id="email" name="email" type="email" autocomplete="email" maxlength="254" />

      <label for="category" id="t-category-label"></label>
      <select id="category" name="category"></select>

      <!-- Art. 16(2) elicitation, revealed when a report category is chosen:
           exact address of the content plus the good-faith accuracy statement. -->
      <div id="reportFields" hidden>
        <p class="hint" id="t-report-hint"></p>
        <label for="url" id="t-url-label"></label>
        <input id="url" name="url" type="text" maxlength="500" />
        <!-- The reported account's public handle (#320) — the only identifier an
             outside reporter can know, since e-mail addresses are never shown. -->
        <label for="reportedUsername" id="t-reported-username-label"></label>
        <input id="reportedUsername" name="reportedUsername" type="text" maxlength="60"
               spellcheck="false" autocapitalize="none" />
        <div class="check">
          <input id="goodFaith" name="goodFaith" type="checkbox" />
          <label for="goodFaith" id="t-goodfaith-label"></label>
        </div>
      </div>

      <label for="subject" id="t-subject-label"></label>
      <input id="subject" name="subject" type="text" maxlength="200" />

      <label for="message" id="t-message-label"></label>
      <textarea id="message" name="message" maxlength="5000" required></textarea>

      <!-- Honeypot (spam trap) — leave empty. -->
      <div class="hp" aria-hidden="true">
        <label for="website">Website</label>
        <input id="website" name="website" type="text" tabindex="-1" autocomplete="off" />
      </div>

      <button type="submit" class="submit" id="t-submit"></button>
    </div>
    <p class="msg ok" id="ok" role="status" hidden></p>
    <p class="msg err" id="err" role="alert" hidden></p>

<!-- The legal links share the availability gate (kontakt.js hides them when
         /api/config reports not-ready — the routes 404 in that state). -->
    <p class="foot"><a href="/" id="t-back"></a><span id="legalLinks">
      · <a href="/impressum">Impressum</a>
      · <a href="/datenschutz">Datenschutz</a>
      · <a href="/nutzungsbedingungen">Nutzungsbedingungen</a></span></p>
  </form>
  <script src="/js/pages/kontakt.js"></script>
</body>
</html>
